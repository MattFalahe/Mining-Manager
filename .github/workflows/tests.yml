name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Every PHP file parses
        run: find src tests -name '*.php' -not -name '*.blade.php' -not -path 'tests/vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install PHPUnit
        run: composer install --working-dir=tests --no-interaction --no-progress

      - name: Run the tests
        run: tests/vendor/bin/phpunit
